[workspace]
resolver = "2"
members = [
    "apps/api",
    "packages/rust/config",
    "packages/rust/domain",
    "packages/rust/wallet",
    "packages/rust/auth",
    "packages/rust/db",
    "packages/rust/chain",
    "packages/rust/lightning",
    "packages/rust/jobs",
    "packages/rust/http-api",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Jonathan Nenba"]

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
jsonwebtoken = "9"
rand = "0.8"
subtle = "2"
base58 = "0.2"
bs58 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
http = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
# tokio-rustls-comp: `rediss://` (TLS) is required outside development.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str", "serde-float"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
base32 = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "uuid", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
bip39 = "2"
ed25519-dalek = "2"
solana-sdk = "5.0"
spl-associated-token-account = { version = "6", features = ["no-entrypoint"] }
spl-token = { version = "7", features = ["no-entrypoint"] }
bech32 = "0.11"
# Transaction building, sighashes and address parsing (already in the lock via the Breez SDK).
bitcoin = "0.32"
# EIP-1559 encoding/hashing and ABI types (already in the lock via the Breez SDK).
alloy-consensus = "1.8"
alloy-primitives = "1.7"
alloy-sol-types = "1.7"
# Tron transaction protobufs, decoded and verified before signing.
prost = "0.13"
# BOLT11 parsing for Lightning withdrawal destinations.
lightning-invoice = "0.34"
ripemd = "0.1"
ipnet = { version = "2", features = ["serde"] }
mockall = "0.13"
# Pinned to a release tag on purpose — bump deliberately, never float it.
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.1", features = ["sqlite"] }

config = { path = "packages/rust/config" }
domain = { path = "packages/rust/domain" }
wallet = { path = "packages/rust/wallet" }
auth = { path = "packages/rust/auth" }
db = { path = "packages/rust/db" }
chain = { path = "packages/rust/chain" }
lightning-client = { path = "packages/rust/lightning" }
jobs = { path = "packages/rust/jobs" }
http-api = { path = "packages/rust/http-api" }
