name: CI

# Third-party actions are pinned by full commit SHA (the comment names the
# version); Dependabot (.github/dependabot.yml) proposes the bumps.

# Manual only: run it from the Actions tab on any branch (or tag). Nothing
# starts it on push or pull request. New App Version dispatches it on the
# release tag; Deploy only warns when the commit it ships has no green run.
on:
  workflow_dispatch:

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last successful commit on the base branch.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build (Nx affected)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned explicitly (matches package.json's packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Rust toolchain, protoc (Breez SDK) and the cargo cache.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # api: cargo clippy -D warnings / cargo test / cargo build --release, all
      # --locked; dashboard: eslint / tsc + vite build. Only what the change affects runs.
      - run: pnpm nx affected -t lint test build --parallel=2
        env:
          NX_DAEMON: 'false'

  # Supply chain of the Rust workspace, on every run (not Nx-affected: a new
  # RustSec advisory fails it without any code change). Policy: deny.toml.
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt binary verified against the checksum in the action's manifest;
      # fallback: none never builds or downloads anything else.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny check
        run: cargo deny --locked check advisories bans licenses sources

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the combined image (all targets)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: all
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
