name: Deploy
# Title of each run in the Actions list; the job below carries the same name.
run-name: Deployment - ${{ fromJSON('{"test":"Test","staging":"Staging","production":"Production"}')[inputs.environment] }}

# Manual, environment-scoped deployments with Kamal (config/deploy.yml, one file for
# every environment: everything that differs comes from the GitHub environment
# selected below).
#
# Only `main` or a `v*` release tag can be deployed, and only a commit that is
# on main and whose CI run succeeded (job `guard`). This file can be edited on a
# branch, so the server-side barrier is the environments' protection rules
# (deployment branches/tags limited to main and v*, required reviewers).
#
# Variables (`vars.*`), required per environment: GATEWAY_HOST (the server, SSH
# target), API_HOST, DASHBOARD_HOST, SSH_KNOWN_HOSTS (the server's host key line(s),
# e.g. from `ssh-keyscan -t ed25519 <GATEWAY_HOST>` checked against
# `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the server console).
# Optional: APP_ENV (defaults to the environment name), SSH_USER (default
# `deploy`, a user in the docker group; set it to `root` to keep deploying
# as root), BITCOIN_ESPLORA_BASE_URL
# (empty disables Bitcoin), TRUSTED_PROXIES, OUTFLOWS_FROZEN ("true" forces the
# outflow freeze; empty = dashboard-managed).
# Secrets (`secrets.*`, every one listed in .kamal/secrets), per environment:
# SSH_PRIVATE_KEY, WALLET_MNEMONIC, JWT_SECRET, POSTGRES_PASSWORD and
# REDIS_PASSWORD (the accessories', >= 32 letters, digits, `-` or `_`, e.g.
# `openssl rand -hex 32`; DATABASE_URL and REDIS_URL are built from them);
# optional: the provider keys (empty disables the network): TRONGRID_API_KEY,
# ALCHEMY_API_KEY, HELIUS_API_KEY, BREEZ_API_KEY. The image is pushed to ghcr.io
# with GITHUB_TOKEN.
#
# Third-party actions are pinned by full commit SHA (the comment names the
# version); Dependabot (.github/dependabot.yml) proposes the bumps.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        type: choice
        # A new environment goes here AND in the JSON table of `run-name` and `jobs.deploy.name`.
        options: [test, staging, production]
      reboot-accessory:
        description: Recreate an accessory first, to apply its changed image or settings (seconds of downtime; data kept)
        required: true
        type: choice
        default: none
        options: [none, postgres, redis]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}

jobs:
  # No environment, so no secret: refuses the run before anything is exposed.
  guard:
    name: Check the ref (main or v* tag, CI green)
    runs-on: ubuntu-latest
    permissions:
      contents: read # compare the commit with main
      actions: read # list the CI runs of the commit
    steps:
      - name: Only main or a v* release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/tags/v*) echo "Deploying $REF" ;;
            *)
              echo "::error::Deploys run from main or a v* release tag only (got $REF)."
              exit 1
              ;;
          esac

      - name: The commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # identical: main's head; behind: an ancestor of main.
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          case "$status" in
            identical | behind) echo "$SHA is on main ($status)" ;;
            *)
              echo "::error::$SHA is not on main (compare: $status)."
              exit 1
              ;;
          esac

      - name: CI succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq .total_count)
          if [ "$runs" -lt 1 ]; then
            echo "::error::No successful CI run for $SHA: wait for CI (or re-run it) before deploying."
            exit 1
          fi
          echo "CI succeeded on $SHA"

  deploy:
    name: Deployment - ${{ fromJSON('{"test":"Test","staging":"Staging","production":"Production"}')[inputs.environment] }}
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The passwords go unencoded into DATABASE_URL / REDIS_URL (.kamal/secrets),
      # where a missing secret would silently become an empty password.
      - name: Accessory passwords (set, URL-safe)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD; do
            if [[ ! "${!name}" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
              echo "::error::The $name secret must be at least 32 letters, digits, '-' or '_' (e.g. openssl rand -hex 32)."
              exit 1
            fi
          done

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
      # Exact version: config/deploy.yml needs >= 2.12 (ssh.forward_agent).
      - run: gem install kamal -v 2.12.0 --no-document

      # Host key pinned from SSH_KNOWN_HOSTS (never trust-on-first-use: a spoofed
      # GATEWAY_HOST would receive the env file with the mnemonic) and
      # StrictHostKeyChecking yes, which Kamal's net-ssh reads (ssh.config: true)
      # and turns into its `:always` verifier. The key goes into an agent, never
      # onto disk.
      - name: SSH setup (pinned host key, key in an agent)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          GATEWAY_HOST: ${{ vars.GATEWAY_HOST }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::The SSH_KNOWN_HOSTS variable is empty: set it to the server's host key line(s) in this environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$GATEWAY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::SSH_KNOWN_HOSTS has no entry for GATEWAY_HOST."
            exit 1
          fi
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            ForwardAgent no
          EOF
          chmod 600 ~/.ssh/config
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The server only needs Docker (installed by hand, or `kamal server bootstrap`
      # once as root). `accessory boot all` creates the missing accessories
      # (Postgres and Redis on empty volumes the first time) and leaves running
      # ones alone; `reboot` recreates one on the same volume. `kamal deploy` then
      # boots kamal-proxy if needed, and the app.
      - name: kamal deploy
        run: |
          if [ "$REBOOT_ACCESSORY" != none ]; then
            kamal accessory reboot "$REBOOT_ACCESSORY"
          fi
          kamal accessory boot all
          kamal deploy
        env:
          REBOOT_ACCESSORY: ${{ inputs.reboot-accessory }}
          # Kamal prefixes the image with registry.server (ghcr.io) itself.
          KAMAL_IMAGE: ${{ github.repository }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GATEWAY_HOST: ${{ vars.GATEWAY_HOST }}
          API_HOST: ${{ vars.API_HOST }}
          DASHBOARD_HOST: ${{ vars.DASHBOARD_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'deploy' }}
          APP_ENV: ${{ vars.APP_ENV || inputs.environment }}
          BITCOIN_ESPLORA_BASE_URL: ${{ vars.BITCOIN_ESPLORA_BASE_URL || '' }}
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES || '' }}
          OUTFLOWS_FROZEN: ${{ vars.OUTFLOWS_FROZEN || '' }}
          WALLET_MNEMONIC: ${{ secrets.WALLET_MNEMONIC }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY || '' }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY || '' }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY || '' }}
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY || '' }}

      - name: Stop the SSH agent
        if: always()
        run: ssh-agent -k > /dev/null 2>&1 || true
