# Composite action shared by CI and release workflows.
# Third-party actions are pinned by full commit SHA (the comment names the
# version); Dependabot (.github/dependabot.yml) proposes the bumps.
name: 'Setup Rust'
description: 'Install Rust toolchain, protoc and enable cargo cache'
runs:
  using: 'composite'
  steps:
    # The Breez SDK (Lightning) compiles its gRPC protos with tonic-build;
    # libprotobuf-dev ships the google/protobuf/*.proto well-known types.
    - name: Install protoc
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    # Pinned to a commit of the action's master branch, so the toolchain is
    # passed explicitly (the @stable branch only presets this input).
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
